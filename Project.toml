# Julia environment of the Habburd_MC_V7 code (not a package: the scripts are
# run directly with `julia --project=<repo> <script>.jl`).
#
# Install once per machine / per cluster depot:
#     julia --project=. -e 'using Pkg; Pkg.instantiate()'
# See docs/WORKFLOW.md, "One-time setup".

[deps]
